<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">Ícones da interface Arenis</title>
  <desc id="desc">Prancha de dez ícones lineares para navegação, jogo, obstáculos e configurações.</desc>
  <rect width="760" height="300" rx="28" fill="#F5F0E4"/>
  <g fill="none" stroke="#245358" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Home -->
    <g transform="translate(30 27)"><path d="M8 38 34 16l26 22v30H17V38M28 68V49h13v19"/></g>
    <!-- Undo -->
    <g transform="translate(178 27)"><path d="M24 26H47c14 0 23 9 23 22s-9 22-23 22H37M24 26l15-14M24 26l15 14"/></g>
    <!-- Restart -->
    <g transform="translate(326 27)"><path d="M59 32a25 25 0 1 0 4 20M59 15v19H40"/></g>
    <!-- Settings -->
    <g transform="translate(474 27)"><circle cx="34" cy="42" r="12"/><path d="m34 13 5 2 4 8 8 1 6-5 8 5-1 8 5 6-2 8-8 4-1 8 5 6-5 8-8-1-6 5-8-2-4-8-8-1-6 5-8-5 1-8-5-6 2-8 8-4 1-8-5-6 5-8 8 1 6-5z" transform="translate(0 2) scale(.85) translate(6 7)"/></g>
    <!-- Pause -->
    <g transform="translate(622 27)"><rect x="21" y="20" width="12" height="44" rx="4"/><rect x="43" y="20" width="12" height="44" rx="4"/></g>
    <!-- Lock -->
    <g transform="translate(30 157)"><rect x="18" y="38" width="38" height="32" rx="6"/><path d="M26 38V27a11 11 0 0 1 22 0v11M37 50v9"/></g>
    <!-- Hidden sand -->
    <g transform="translate(178 157)"><path d="M21 20h32M26 20v12l9 12v18L23 68h28L39 62V44l10-12V20"/><path d="M30 55h13M34 49h7" stroke-dasharray="2 5"/></g>
    <!-- Star -->
    <g transform="translate(326 157)"><path d="m38 15 8 17 19 3-14 13 4 19-17-10-17 10 4-19-14-13 19-3z" fill="#D7A35A" stroke="#245358"/></g>
    <!-- Sound -->
    <g transform="translate(474 157)"><path d="M16 36h13l16-13v39L29 49H16z"/><path d="M54 33q12 10 0 21M60 25q20 18 0 37"/></g>
    <!-- Confirm -->
    <g transform="translate(622 157)"><circle cx="38" cy="42" r="27" fill="#D9E7E2"/><path d="m25 42 9 9 18-20"/></g>
  </g>
  <g fill="#53696A" font-family="Nunito Sans, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="68" y="119">Início</text><text x="216" y="119">Desfazer</text><text x="364" y="119">Reiniciar</text><text x="512" y="119">Configurações</text><text x="660" y="119">Pausar</text>
    <text x="68" y="249">Trancado</text><text x="216" y="249">Oculto</text><text x="364" y="249">Estrela</text><text x="512" y="249">Som</text><text x="660" y="249">Concluir</text>
  </g>
</svg>
